<!--
  inside/index.html — the cabin's interior sub-page.

  Mounted at /inside/. Day 11 (2026-05-19) opens the door. Stepping
  through, you see the hearth wall — the cabin's south wall, the
  same wall the front-view window cuts through. The brick that
  has been visible from outside through that window since Day 0
  ("a window glimpsing a brick hearth inside") is the back of
  this hearth column, seen from the side that has the fire on it.
  The chimney column rises straight through the wall to the roof
  the front and around views both show.

  Cross-view geometry (RULES.md Article XIII):
    - Hearth wall = south wall (the one with the window in the front view).
    - Brick visible through the front-view window = back face of this
      hearth column. From outside, you see the brick because the
      hearth backs directly onto the south wall; the "window" is
      really a cut in the planking exposing the brick behind.
    - Chimney rises straight up through the wall, exiting the roof
      where the front and around views show its cap.
    - Door is on the east wall (visible in /around/), to the
      viewer's right in this view. Not drawn in this first interior
      pass — only the hearth wall is shown. A future view can
      widen out to show the room's corners.

  Day 12 (2026-05-20) adds three small things to the mantle: a
  river stone on the left (the same earth tones as the outside
  path stones — one carried indoors), a short lit candle in the
  middle (the "small lit thing" the mantle is for), and a small
  terracotta jar with a green sprig on the right (the windowbox
  that never got built outside, arrived inside instead). All
  drawn from scratch in CSS, sitting on top of the mantle at the
  same native-pixel scale as the rest of the hearth.

  Day 13 (2026-05-21) places a small wooden chair on the floor to
  the left of the hearth, side-view, facing right (toward the
  fire). The first piece of the room beyond the hearth wall — a
  shape that says someone sits here. Same wood-dark register as
  the mantle so the two pieces of furniture rhyme. Drawn from
  scratch in CSS at the same 3x / 2x scale as everything else
  in this view.

  Day 14 (2026-05-22) adds a small stack of cut firewood on the
  floor to the right of the hearth, mirroring the chair's anchor
  on the left but not its shape — chair says *sat in*, woodpile
  says *used*. Same gap from the hearth (~14px desktop / ~10px
  mobile-narrow). Wood register matches the burning log inside
  the fire (#3a2418 / #6a3a18), so the pile reads as the same
  kind of wood that's currently lit.

  Day 15 (2026-05-23) hangs a small cloak from a wooden peg on
  the wall above the chair — the first thing on the room's
  mid-wall band, between the floor objects and the mantle. The
  chair below says *sat in*; the cloak says *worn* — the trace
  of a body that just stepped out. Plum-coloured against the
  wood-plank wall so the new tone introduces itself without
  fighting the warm-brown register of the rest of the room.
  Same horizontal envelope as the chair (centred over it), so
  the two pieces share a vertical column on the wall.

  Day 22 (2026-05-30) places a small moth above the candle on
  the mantle — the inside's first visitor, drawn to the
  smallest lit thing the resident keeps lit. Plum body with
  purple-soft wings, the same chosen tones as the cloak;
  outside, the bee arrived wearing the wood-browns of the
  walls, and now indoors the moth arrives wearing the cloak's
  colours. Sibling sprite to .sprite--bee and .sprite--bird,
  drifting on a slow loop around the candle flame.

  Day 29 (2026-06-06) gives the moth its flutter — the first of
  the founder's deferred small-fixes (see messages/open/
  2026-05-30-visual-coherence.md). Its wings now flap between an
  up-stroke and a down-stroke, and its flight is an erratic
  dart-and-drift around the flame instead of a smooth ring,
  answering the founder's note that "a moth flutters and darts;
  it doesn't glide in a smooth circle like a spider on a thread."

  Day 36 (2026-06-13) is the legibility pass — the last of the
  founder's deferred small-fixes ("the cloak / woodpile / mantle
  stone -> only if they can be made to read at their size"). The
  cloak's silhouette now gathers narrow at a small peg and flares
  to its hem so it reads as hung cloth instead of a plum box; the
  woodpile is restacked end-on as a pyramid of pale sawn faces
  ringed in bark; the mantle stone loses its corners and gains a
  lit top so it reads as a pebble rather than a small brick.
  Silhouette, not detail — the founder's note named the lever.

  Day 31 (2026-06-08) sets the fire down onto its hearth — the
  second of the founder's deferred small-fixes ("the fire floating
  in the firebox -> rest it on the hearth floor (or a visible
  grate)"). A glowing ember bed now spans the firebox floor; the
  log sits on the coals and the flames rise off it with a base
  spread jamb-to-jamb, so the fire reads as seated under its own
  weight rather than a narrow flame marooned in a dark cavity.

  Day 47 (2026-06-24) sets a small glass tumbler on the window's
  sill — the day-lit thing the sill earns that the mantle never
  could. The mantle's three things (stone, candle, jar) are all
  fire-side and steady; this glass is the first object that answers
  to the sky instead. It's translucent (the meadow band shows
  through it) and takes the SAME hour-wash as .window__pane, so the
  glass and the panes behind it glow together — clear by day, gold
  at dusk, dusk-blue at night. The terracotta jar on the mantle and
  the glass on the sill are siblings: same small-vessel shape, one
  holding earth by the fire, the other holding the day's light.

  Day 77 (2026-07-24) lets the candle BURN — the clearing's first thing
  that wears. Its wax height (--candle-h in inside.css) rides the real
  hour: full at dawn and through the day, spent down to two-thirds at
  dusk and to half by night, and standing full again at the next dawn.
  The wick and flame ride the shrinking wax down with it. It's wear that
  the day's turn gives back, not loss — the spell here is "nothing is
  lost," not "nothing changes," and the candle was the one still thing on
  the mantle pretending the hour didn't touch it (see diary 2026-07-24).
  Unlike the window's hour-wash, which tints the glass, this is the room's
  first fire-side object to answer the hour by changing SHAPE.

  Day 78 (2026-07-25) lets the mantle sprig REACH — the jar's green stem
  now leans toward the window through the daylit hours (a gentle tilt at
  dawn, its fullest lean at midday, easing back at dusk) and stands upright
  to rest at full night, phototropism keyed to the same data-tod the candle
  and window read. It's the mantle's second small turning thing after the
  candle, but a different kind: the candle spends its wax down and the day
  gives it back (a wearing); the sprig spends nothing and only leans toward
  and away from the light (a reaching). And it answers the WINDOW — the one
  square of this fire-lit room that keeps the real hour — not the fire
  beside it, so the jar becomes the sunward/morning end of the mantle as the
  candle is the evening end. Done as a scale-independent CSS rotate() about
  the stem's base, so the 2x block needs no restating (see diary 2026-07-25).

  Day 83 (2026-07-30) lets the window's glass keep the YEAR as well as the
  hour. Day 46's rule already decided it — the day glimpsed through the
  inside pane is the actual day outside, not a painted copy — and a day
  belongs to a season. The pane's ::before now carries the same season wash
  the yard wears (scene.css .scene[data-season]::before), under the hour
  tint on its ::after, the same layering the yard keeps. The meadow band in
  the lower panes is no longer the one square of always-summer in the house:
  gold under autumn, hushed (never bare) under winter, pistachio-fresh in
  spring, and all but untouched in summer, the home season.

  Day 90 (2026-08-06) lets the two things standing on the floor BLOCK that
  light. The chair and the woodpile each wore only a contact band before —
  one native row of ink under the feet, which grounds a thing but points
  nowhere. Now each throws a cast shadow along the boards, away from the
  fire: the chair's to the left, the woodpile's to the right. Outdoors the
  refusal against cast shadows still stands (the sun is offstage, so a lit
  side there would invent a position no frame shows); indoors the light is
  drawn, low and near the middle of the picture, so a shadow obeys a place
  already visible rather than inventing one. The divergence is the tell it's
  the hearth and not a smuggled sun — a far sun lays all shadows parallel, a
  near light throws each object its own way. Lengths ride the season with the
  pool that casts them, because a shadow can only be as long as the light it
  interrupts (inside.css, "Cast shadows on the boards").

  Day 91 (2026-08-07) gives the MANTLE its one light. Day 90's question was
  whether the candle owes the shelf shadows the way the fire owes them to the
  floor, and the answer is no — but not for the reason it looked like. A low
  near light throws LONG, not short: carried out, the stone's shadow would run
  off the end of the shelf. It has nowhere to land. The floor is a plane this
  view looks across, with depth to set things back into; the mantle is a shelf
  the view looks AT, edge-on, its top a single line with no width for a shadow
  to lie along. So the shelf takes the other half of what a drawn light gives:
  the light itself, and lit sides on what stands in it.
    - .candle-light — a small warm glow on the brick behind the flame, the
      mantle-scale twin of the floor's hearth-light pool (Day 89). It answers
      the HOUR, not the year: nothing feeds a candle, so it never grows or
      shrinks — it simply SINKS with the wax, keyed to --candle-h (hoisted from
      the candle element up to .hearth so the glow can read it too). 30 native
      wide, which is very nearly the mantle: it reaches the stone at one end
      and the jar at the other and dies before the cloak on its peg.
    - The stone and the jar now take a lit face FROM that flame, on facing
      sides — the stone lit on its right, the jar on its left, both turned
      inward toward the candle standing between them. Day 90's floor shadows
      diverge away from the fire; these converge toward the flame. Both are the
      same tell: a distant light turns every object the same way, a near drawn
      one arranges them around itself. Only the lit side is drawn, never a
      shaded one — --c-wood is the plank wall's own colour, so a shaded away
      flank on a 4-or-5-wide object dissolves into the boards behind it.
    - The candle itself LOST its shading. It had worn a soft band down its
      right edge since Day 12 — the cylinder trick, which says a brighter thing
      stands off to the left, and nothing does. A light source has no shadowed
      side. The band moved to the bottom row, where a real candle's wax does go
      dull away from its own flame (see diary 2026-08-07).

  Contract elements preserved (same as the home and around shells):
    - <meta name="build-sha" content="">
    - <script src="../build-sha.js" defer>
    - <span id="day-label">
    - <span id="build-sha-label">

  theme.css and scene.css are reused for the world frame (border,
  the .scene container, nav, day-marker). inside.css overrides the
  scene's interior — no sky, no ground; instead a hearth wall and
  a plank floor.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Inside the cabin — the hearth wall, fire lit.">
  <meta name="theme-color" content="#3a2a1f">

  <meta name="build-sha" content="">
  <script src="../build-sha.js" defer></script>

  <!-- The window keeps the real hour (Day 46). sky.js tags the scene with the
       time of day; inside.css tints ONLY the window's glass with it (the room
       itself stays fire-lit and steady — a hearth doesn't go blue at dusk).
       The one square of the room that sees out is the one that keeps the hour. -->
  <script src="../sky.js" defer></script>

  <!-- The room is tagged with the real season too (season.js). A fire-lit room
       reads the year through its window, not across its walls — so the room's
       wash stays untouched, and the one green thing on the mantle takes the
       season instead: the jar's sprig (Day 82) wears the trees' own season
       filters and draws in for winter, the year arriving indoors in the leaf
       rather than in the light. Same staged way sky.js tagged the room from
       Day 43 and only tinted its glass at Day 46. -->
  <script src="../season.js" defer></script>

  <title>The Cabin — inside</title>

<body>
  <main id="cabin-scene" aria-label="inside the cabin">
    <div class="scene scene--inside">
      <div class="inside__wall"></div>
      <div class="inside__floor"></div>

      <!-- Hearth-light on the boards (Day 89, 2026-08-05): the pool of warm
           light the fire throws onto the floor around its foot. Day 88 let the
           hearth fire burn deeper in the cold — but the room it lights was
           unchanged by that, which is the same shape of lie the fire's chain
           kept turning up: a bigger fire that does nothing more. Light is what
           a fire is FOR, so the room's answer to the season is the reach of its
           own firelight, not furniture shuffled about by a person this place
           has promised never to draw. Decorative; the hearth's own label below
           mentions it. -->
      <div class="hearth-light" aria-hidden="true"></div>

      <!-- The map card (Day 35): indoors it reads as the plan of the place
           pinned to the wall — tap to open /map/. Replaces the bottom nav
           strip (kept hidden for keyboards and screen readers; scene.css). -->
      <a class="map-button" href="../map/" aria-label="open the map of the clearing">
        <span class="map-button__plan" aria-hidden="true"></span>
      </a>

      <div class="hearth" role="img"
           aria-label="A brick hearth built into the cabin's south wall — a column of warm peach brick laid in running bond, the same brick you glimpse through the front window from outside, rising from a low foot on the floor up and off the top of the frame as the chimney passes through the ceiling, with a fire opening down near the middle of the floor where a small fire rests on a glowing bed of coals, and a dark wood mantle higher up the column holding three small things: a smooth river stone on the left, a short lit candle in the middle, and a small terracotta jar with a green sprig on the right. The fire lays a soft pool of warm light on the floorboards around the hearth's foot — small in summer, reaching as far as the chair and the woodpile in the cold months. The candle lays a smaller glow of its own on the brick behind it, about the width of the shelf, sinking down the wall as the wax spends through the evening; the stone and the jar each catch that light on the side facing it, the stone lit along its right flank and the jar along its left.">
        <div class="hearth__column">
          <!-- Brick body: running-bond courses (4 native each), the same
               .brick-course / .brick-course--b rows the front-view window uses
               (scene.css) so the hearth brick and the brick glimpsed through the
               window are one material. Day 38 (2026-06-15): the column now runs
               floor-to-ceiling-and-off-the-top, whose native height varies with
               the scene width, so the stack is deliberately OVER-supplied (44
               courses). .hearth__brick packs them from the bottom
               (justify-content:flex-end) and clips the surplus off the top with
               overflow:hidden — so the foot is always complete and the brick
               always reaches the frame's top edge, at any width. -->
          <div class="hearth__brick">
            <div class="brick-course"></div>
            <div class="brick-course brick-course--b"></div>
            <div class="brick-course"></div>

        <!-- Day 91 (2026-08-07): the candle's own light on the brick behind

        <div class="candle-light" aria-hidden="true"></div>

      <div class="chair" role="img"
           aria-label="A small wooden chair on the floor to the left of the hearth, side-view, angled toward the fire — the first piece of the room beyond the hearth wall. The firelight lays its shadow along the boards to its left, away from the flame, longer in the cold months.">

      <!-- Window (Day 45, 2026-06-22): the room's first opening — a small
           wood-framed, four-pane window cut into the south (hearth) wall to
           the right of the chimney, above the woodpile. Until today the inside
           was "all fire and brick, no glass" (the Day-44 diary): lit only by
           the hearth, with no way for the day to reach the floor. This is the
           opening the light could come through — what it SEES is held simple
           for now (a calm pale sky over a band of meadow, the crossbar reading
           as the horizon), deferring the open question of whether the inside
           should keep the real hour the way the yard does. Cross-view geometry
           (RULES.md Article XIII; revised Day 48 — see messages/done/2026-06-24-
           front-window-and-inside-wall.md): this window lives on one of the two
           outside walls this world never draws (only the front and door faces are
           shown), so it owes no twin to the front. The Day-45 front sidewindow
           was removed on Day 48; the "one hole, two readings" idea is deferred
           until a hidden wall is ever drawn from outside. -->
      <div class="window" role="img"
           aria-label="A small four-pane window in the cabin's wall to the right of the hearth, above the woodpile — a wooden frame on a low sill, its panes showing a pale sky above and a band of meadow below, divided by a cross of muntins whose horizontal bar reads as the horizon. The glass keeps the real hour and the real season both: the band is summer-green now, gold in autumn, hushed pale in winter, fresh in spring. On the sill stands a small glass tumbler that takes the same hour the panes do — clear by day, gold at dusk, dusk-blue at night. The room's way to see out.">
        <div class="window__pane"></div>
        <div class="window__muntin-v"></div>
        <div class="window__muntin-h"></div>
        <div class="window__sill"></div>
        <!-- A small glass on the sill (Day 47, 2026-06-24): the day-lit thing the

        <div class="sill-glass" aria-hidden="true"></div>
      </div>
