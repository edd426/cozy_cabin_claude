name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write           # write so the screenshot job can publish previews and keep baselines
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build-sha + diary manifest
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          ls -la build-sha.txt build-sha.js diary/manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site (previews/ is a repo record, not site content)
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='/previews' --exclude='/.git' --exclude='/.github' ./ "$RUNNER_TEMP/site/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true   # transient "try again later" API failures (2026-07-03); retried below

      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy (transient Pages failure)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  screenshot:
    needs: deploy
    runs-on: ubuntu-latest
    # Was 5 ("fail fast to avoid blocking the concurrency: pages group").
    # Right instinct, wrong variable: the cap bounded the symptom while the
    # cause — a ~21 MB apt font fetch on every run — kept racing it. On
    # 2026-08-04 the identical config in the far-keeper tower lost that race:
    # the job was cancelled mid-download and that day's previews are gone for
    # good. Cabin's screenshot jobs were running 2m14s–2m31s against this 5m
    # cap while doing strictly more work (gallery + two motion steps), so it
    # had less headroom than far-keeper, not more. The install below no longer
    # touches apt; 10 is a backstop now, still bounded so a hung job holds the
    # pages lane for at most 10 minutes.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout (with full history so we can push back)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The sha every picture and the verdict are named for, taken once, here,
      # before any step can move HEAD — so the verdict step at the very end
      # can still name this deploy when a step in the middle has failed.
      - name: Note which commit this run is for
        run: echo "DEPLOY_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.49.0-${{ runner.os }}

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.49.0
          # Deliberately NOT --with-deps. That flag apt-fetches ~21 MB of CJK,
          # Thai and Unifont packages every run; ubuntu-latest already carries
          # Chromium's shared libraries, and the cabin renders its own scene
          # from CSS and composed assets, not from system fonts.
          npx playwright install chromium
          # Don't take that on faith — prove Chromium launches on the bare
          # runner, and only pay for system deps on a run that needs them.
          if ! node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "chromium did not launch bare; installing system deps"
            npx playwright install-deps chromium
          fi

      - name: Wait for Pages to settle
        run: sleep 25

      - name: Capture screenshots (all views from scripts/views.json)
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p previews
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          # Manifest-driven loop. Home view lands at previews/<date>-<sha>.png
          # (unsuffixed, preserving wait-for-deploy.sh's contract); additional
          # views land at previews/<date>-<sha>-<view>.png. Add a view by
          # editing scripts/views.json — no workflow change needed.
          node scripts/screenshot.js --manifest scripts/views.json \
            "$PAGE_URL" previews "$DATE_TAG" "$SHA_SHORT"

      - name: Capture forced-state gallery (hours + seasons the schedule can't reach)
        # The nightly deploy lands ~00:10 UTC (sky.js bins that as night) in a
        # summer month, so the manifest step above only ever records night-summer.
        # This forces data-tod / data-season and captures the home view in each
        # gated state (messages/2026-07-17 "see your own work"). continue-on-error
        # is deliberate: a gallery failure must never block the home preview commit
        # below — that unsuffixed PNG is wait-for-deploy.sh's locked contract, and
        # the manifest step already wrote it before this step runs.
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          node scripts/screenshot.js --gallery \
            "$PAGE_URL" previews "$DATE_TAG" "$SHA_SHORT"

      - name: Capture motion filmstrips (the moving things a still can't prove)
        # Half the clearing moves — the smoke leaning downwind, the flag, the
        # swaying crowns, the night fireflies — and every still in the record
        # (manifest + gallery) swears none of it. This captures the home scene six
        # frames a beat apart and composites each into one read-left-to-right strip
        # (messages/2026-07-17 "see your own work", motion slice). continue-on-error
        # for the same reason as the gallery: a motion hiccup must never block the
        # unsuffixed home preview that wait-for-deploy.sh's locked contract needs —
        # the manifest step already wrote it before this step runs.
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          node scripts/screenshot.js --motion \
            "$PAGE_URL" previews "$DATE_TAG" "$SHA_SHORT"

      - name: Capture cross-view motion strip (one wind told twice)
        # The --motion strips above read across TIME within one view. This one
        # reads across the HOUSE: the front face (smoke leans downwind) stacked
        # over the door side (smoke rises straight, that face looking down the
        # wind's throat), so the whole quiet proof that ONE wind blows through the
        # clearing sits in a single frame — a thing no single-view strip can show
        # (diary 2026-07-19 … 2026-07-22). continue-on-error for the same reason as
        # the gallery and motion steps: a hiccup here must never block the unsuffixed
        # home preview that wait-for-deploy.sh's locked contract needs — the manifest
        # step already wrote it before this step runs.
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          node scripts/screenshot.js --motion-cross \
            "$PAGE_URL" previews "$DATE_TAG" "$SHA_SHORT"

      - name: Hold the clearing to the picture kept of it
        # Every other guard here is made of things the agent believes: a
        # reading held to a number she wrote, a bound she chose, a sweep minus
        # a list she compiled — and each was proved out by breaking the yard in
        # a way she had already imagined. So what they catch is bounded by that
        # imagination, and the far keeper's six green days are the case against
        # trusting it (diary 2026-09-03, 2026-09-04).
        #
        # This one knows nothing about the yard. It pins the clock and stops
        # the animations, which makes the frame a pure function of the drawing,
        # and holds it against the picture kept in previews/baseline/. Every
        # difference is either a thing the day meant — in which case the day
        # removed that frame from previews/baseline/, and the run below keeps
        # it afresh — or a thing nobody thought to ask about, which is the only
        # kind of finding no other check here can produce.
        #
        # The kept frames are made HERE, by this browser, and that is load
        # bearing. The first run of this step (Day 119, afe1338) held five of
        # seven frames bit-identical against sandbox-made pictures and reported
        # 1327 px on the map — every glyph of its rendered labels — and 48 px
        # inside the firebox, because the pinned Playwright's Chromium build
        # and the sandbox's pre-staged one disagree about type and about the
        # odd gradient. No channel tolerance separates a re-antialiased glyph
        # from a moved one, so instead the comparison is kept inside one
        # renderer: a frame with no kept picture is kept, not failed.
        #
        # continue-on-error, but NOT for the gallery/motion reason: a drifted
        # frame writes a `kept | this morning | what moved` picture into
        # previews/, and the commit step below is what puts it in the permanent
        # record where tomorrow's memory pass will find it. The run is failed
        # at the very end instead, by the gate step after the other two checks.
        id: drift
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -o pipefail
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          node tools/check-drift.js "$PAGE_URL" \
            --out previews --prefix "${DATE_TAG}-${SHA_SHORT}-" 2>&1 | tee "$RUNNER_TEMP/check-drift.log"

      # Since 2026-10-03 the pictures no longer go on main. Every set was
      # committed there from Day 1 (44 PNGs a commit, ~540 MB by then, and the
      # history behind it), and every clone paid for all of it. Two places now:
      #
      # - previews/baseline/ stays on main. Those are the kept frames
      #   check-drift.js holds the clearing against, so they must outlive a
      #   deploy. They change only when a day declares a change (git rm) and
      #   the drift step keeps the frame afresh, so this commit is rare and small.
      # - Everything else goes to the `previews` branch, which always holds
      #   exactly one commit — this deploy's set — force-pushed, so it never
      #   grows. The bot authorship and the `ci: deploy preview for <sha>`
      #   subject are the proof wait-for-deploy.sh checks.
      #
      # Baseline first, so that by the time the branch names this deploy, any
      # frame it kept is already on main for wait-for-deploy.sh to pull.
      - name: Commit kept baseline frames to main if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The sha the pictures were named for, taken before this step can
          # move HEAD; the publish step below names the branch commit by it.
          DEPLOY_SHA="$(git rev-parse --short HEAD)"
          echo "DEPLOY_SHA=${DEPLOY_SHA}" >> "$GITHUB_ENV"
          if [[ -n "$(git status --porcelain previews/baseline/)" ]]; then
            git add previews/baseline/
            git commit -m "ci: keep baseline frames for ${DEPLOY_SHA}" -m "[skip ci]"
            for i in 1 2 3; do
              git push && break
              git pull --rebase && continue
            done
          else
            echo "no baseline changes to commit"
          fi

      # Built with plumbing, in a separate index over a copy of the pictures,
      # so the checkout the three checks below run from is never touched.
      - name: Publish screenshots to the previews branch
        run: |
          PUB="$RUNNER_TEMP/pub"
          mkdir -p "$PUB/previews"
          # This deploy's pictures only, by sha: anything else in previews/
          # (an older set, a stray) is not this deploy's to vouch for.
          find previews -maxdepth 1 -type f -name "*-${DEPLOY_SHA}*.png" -exec cp {} "$PUB/previews/" \;
          COUNT="$(find "$PUB/previews" -type f | wc -l)"
          echo "publishing ${COUNT} pictures for ${DEPLOY_SHA}"
          [[ "$COUNT" -gt 0 ]] || { echo "no pictures for ${DEPLOY_SHA}; not publishing" >&2; exit 1; }
          export GIT_INDEX_FILE="$RUNNER_TEMP/previews.index"
          git --work-tree="$PUB" add -A
          TREE="$(git write-tree)"
          COMMIT="$(git commit-tree "$TREE" -m "ci: deploy preview for ${DEPLOY_SHA}" -m "[skip ci]")"
          git push --force origin "${COMMIT}:refs/heads/previews"

      - name: Hold the almanac to the clearing
        # /almanac/ publishes what this place will do on a day nobody has
        # reached yet. Its figures are asked of sky.js and season.js, so they
        # cannot drift — but its SENTENCES are a hand describing what each
        # season and hour changes in scene.css and inside.css, and a later day
        # could change a layer and never come back to mend the line. That made
        # the almanac the one thing here able to lie without anything breaking
        # (diary 2026-08-13). This reads the witnesses (window.CabinAlmanac)
        # off the page itself and goes and takes every measurement on the live
        # views, so it can only ever test the claims the page actually makes.
        #
        # This is what keeps a published promise honest, and it is supposed to
        # turn the run red. It sits after the previews are pushed, so a red
        # check never costs the record its pictures.
        #
        # continue-on-error since Day 152, and that does NOT soften it: it
        # used to stop the job on a failure, which skipped every check after
        # it, so a red almanac hid whatever the gallery and the lists would
        # have said. Now every check reports, the verdict step names each one,
        # and the gate at the very end turns the run red if any of them broke.
        id: almanac
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -o pipefail
          node tools/check-almanac.js "$PAGE_URL" 2>&1 | tee "$RUNNER_TEMP/check-almanac.log"

      - name: Hold the record to the clearing
        # The step above holds the almanac's SENTENCES to what the yard does.
        # This holds the gallery's PICTURES to what the yard shows, on one
        # claim: everything drawn in this clearing shows in at least one kept
        # frame. The forced states are two rails crossing at the middle, which
        # covers every layer gated on one wheel and misses any layer gated on
        # BOTH at once — those live only at a corner off both rails. There have
        # been such layers since Day 84 (the winter stars), and each has been
        # noticed by hand; this is so the next one needn't be. It sweeps all
        # sixteen (season, band) states on the three scene views and reads the
        # kept frames off GALLERY_STATES in scripts/screenshot.js, so it can
        # only ever test the gallery that actually runs.
        #
        # Same flags as the almanac check and for the same reasons: a record
        # that has stopped covering the clearing turns the run red (at the
        # gate, after every check has spoken), and it runs after the previews
        # are pushed so a red check never costs the record its pictures.
        # Cheap — three page loads, motion off, all sixteen states forced in
        # the same DOM.
        id: gallery
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -o pipefail
          node tools/check-gallery.js "$PAGE_URL" 2>&1 | tee "$RUNNER_TEMP/check-gallery.log"

      - name: Hold the lists to one another
        # The two steps above hold this place to its own sentences and its own
        # pictures. This one holds no claim about the clearing at all — it holds
        # the hand-written selector lists the checks are made of, on one claim:
        # no name on them stands inside another name, or over the same element
        # as another name, without its being written down.
        #
        # Day 131 found a witness that would lie if it were handed another
        # witness's damage, and the reason it could was a nesting nobody knew
        # about — `door-plant-tone` hides `.door-plant__foliage` while
        # `door-paint-lean` isolates `.door-plant`, which is the thing that
        # foliage is inside. The page seal shuts that at the moment two readings
        # share a page. This names the relation before there is a collision,
        # which is the only point at which a hand is still writing the list.
        #
        # Not published on /almanac/, for the reason check-drift.js is not
        # either: that page is for what this place promises, and a guard on the
        # runner's own bookkeeping belongs beside the runner.
        #
        # Same flags and the same reasons as the two above. Cheap — four page
        # loads, no forcing, no screenshots.
        id: nesting
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -o pipefail
          node tools/check-nesting.js "$PAGE_URL" 2>&1 | tee "$RUNNER_TEMP/check-nesting.log"

      - name: Hold every page to the order its scripts load in
        # Day 152. Every reader of a window.Cabin* reckoning falls back quietly
        # when the reckoning isn't there yet, so a page that loads its
        # publisher too late never breaks — it just draws something else on a
        # slow connection. That is how the home page's bed drew the wrong
        # flowers for 36 days (founder, 2026-10-06). This opens each page with
        # each publisher held back on the wire in turn and fails on any read
        # made before the publisher ran. Same flags as the three above.
        id: loadorder
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -o pipefail
          node tools/check-load-order.js "$PAGE_URL" 2>&1 | tee "$RUNNER_TEMP/check-load-order.log"

      - name: Stamp the verdict on the previews branch
        # Day 152 (messages/open/2026-10-06-the-bed-that-drew-itself-twice.md).
        # The morning's deploy check (scripts/wait-for-deploy.sh, locked)
        # returns the moment the pictures reach the previews branch, and the
        # pictures go up BEFORE the checks — so on 2026-10-02 and 2026-10-06
        # the poll came back green a minute before the run went red, and the
        # writeup went out on a red main with nobody the wiser.
        #
        # So the job ends, always, by adding previews/<sha>-verdict.txt to the
        # same single commit the pictures are in — GREEN or RED, every check's
        # outcome, and the failing lines of any that broke — and the morning
        # reads it with tools/ci-verdict.js, which waits for it. `always()` is
        # the whole point: a job that died halfway still says so. The subject
        # stays `ci: deploy preview for <sha>`, which wait-for-deploy.sh checks.
        if: always()
        env:
          JOB: ${{ job.status }}
          DRIFT: ${{ steps.drift.outcome }}
          ALMANAC: ${{ steps.almanac.outcome }}
          GALLERY: ${{ steps.gallery.outcome }}
          NESTING: ${{ steps.nesting.outcome }}
          LOADORDER: ${{ steps.loadorder.outcome }}
        run: |
          set -o pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SHA="${DEPLOY_SHA:?no deploy sha was noted}"
          V="$RUNNER_TEMP/verdict.txt"
          VERDICT=GREEN
          [[ "$JOB" == "success" ]] || VERDICT=RED
          for o in "$DRIFT" "$ALMANAC" "$GALLERY" "$NESTING" "$LOADORDER"; do
            [[ "$o" == "success" ]] || VERDICT=RED
          done
          {
            echo "VERDICT: ${VERDICT}"
            echo "commit: ${SHA}   run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "job before the checks: ${JOB}"
            echo "check-drift:      ${DRIFT:-never reached}"
            echo "check-almanac:    ${ALMANAC:-never reached}"
            echo "check-gallery:    ${GALLERY:-never reached}"
            echo "check-nesting:    ${NESTING:-never reached}"
            echo "check-load-order: ${LOADORDER:-never reached}"
            for pair in "drift:$DRIFT" "almanac:$ALMANAC" "gallery:$GALLERY" "nesting:$NESTING" "load-order:$LOADORDER"; do
              c="${pair%%:*}"
              L="$RUNNER_TEMP/check-${c}.log"
              # Only a check that failed is quoted; a green one may still
              # print a ✗ beside a reading it then holds.
              [[ "${pair#*:}" == "success" || ! -f "$L" ]] && continue
              HITS="$(grep -E 'BROKE|✗|FAIL|UNBORN|UNDECLARED|REFUSED|NOT FOUND|Error' "$L" | head -n 40 || true)"
              if [[ -n "$HITS" ]]; then
                echo ""
                echo "--- check-${c}, the lines that broke ---"
                echo "$HITS"
              fi
            done
          } > "$V"
          cat "$V"
          # Onto the pictures' own commit if the branch holds this deploy's;
          # alone otherwise (the publish never happened), so the morning still
          # finds a verdict rather than a silence.
          export GIT_INDEX_FILE="$RUNNER_TEMP/verdict.index"
          rm -f "$GIT_INDEX_FILE"
          git fetch --quiet origin '+refs/heads/previews:refs/remotes/origin/previews' || true
          if [[ "$(git log -1 --format=%s origin/previews 2>/dev/null)" == "ci: deploy preview for ${SHA}" ]]; then
            git read-tree origin/previews
          else
            git read-tree --empty
          fi
          BLOB="$(git hash-object -w "$V")"
          git update-index --add --cacheinfo "100644,${BLOB},previews/${SHA}-verdict.txt"
          TREE="$(git write-tree)"
          COMMIT="$(git commit-tree "$TREE" -m "ci: deploy preview for ${SHA}" -m "verdict: ${VERDICT}" -m "[skip ci]")"
          git push --force origin "${COMMIT}:refs/heads/previews"

      - name: Fail the run if any check broke
        # The gate for every check above, all of which carry continue-on-error
        # so that each one reports and the verdict can name them all. Last of
        # all, after the verdict is on the branch.
        if: always()
        env:
          DRIFT: ${{ steps.drift.outcome }}
          ALMANAC: ${{ steps.almanac.outcome }}
          GALLERY: ${{ steps.gallery.outcome }}
          NESTING: ${{ steps.nesting.outcome }}
          LOADORDER: ${{ steps.loadorder.outcome }}
        run: |
          FAILED=0
          for pair in "drift:$DRIFT" "almanac:$ALMANAC" "gallery:$GALLERY" "nesting:$NESTING" "load-order:$LOADORDER"; do
            if [[ "${pair#*:}" != "success" ]]; then
              echo "check-${pair%%:*}: ${pair#*:}" >&2
              FAILED=1
            fi
          done
          if [[ "$DRIFT" == "failure" ]]; then
            echo "The clearing differs from the picture kept of it in" >&2
            echo "previews/baseline/. Read this run's previews/*-drift-*.png:" >&2
            echo "the three panels are kept | this morning | what moved." >&2
            echo "If every moved pixel was meant, git rm the frames named above" >&2
            echo "from previews/baseline/ and commit that beside the change —" >&2
            echo "the next run keeps them afresh, in this browser." >&2
          fi
          exit "$FAILED"
