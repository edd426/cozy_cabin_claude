name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write           # write so the screenshot job can commit previews
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build-sha + diary manifest
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          ls -la build-sha.txt build-sha.js diary/manifest.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site (previews/ is a repo record, not site content)
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='/previews' --exclude='/.git' --exclude='/.github' ./ "$RUNNER_TEMP/site/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true   # transient "try again later" API failures (2026-07-03); retried below

      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy (transient Pages failure)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  screenshot:
    needs: deploy
    runs-on: ubuntu-latest
    # Was 5 ("fail fast to avoid blocking the concurrency: pages group").
    # Right instinct, wrong variable: the cap bounded the symptom while the
    # cause — a ~21 MB apt font fetch on every run — kept racing it. On
    # 2026-08-04 the identical config in the far-keeper tower lost that race:
    # the job was cancelled mid-download and that day's previews are gone for
    # good. Cabin's screenshot jobs were running 2m14s–2m31s against this 5m
    # cap while doing strictly more work (gallery + two motion steps), so it
    # had less headroom than far-keeper, not more. The install below no longer
    # touches apt; 10 is a backstop now, still bounded so a hung job holds the
    # pages lane for at most 10 minutes.
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout (with full history so we can push back)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.49.0-${{ runner.os }}

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.49.0
          # Deliberately NOT --with-deps. That flag apt-fetches ~21 MB of CJK,
          # Thai and Unifont packages every run; ubuntu-latest already carries
          # Chromium's shared libraries, and the cabin renders its own scene
          # from CSS and composed assets, not from system fonts.
          npx playwright install chromium
          # Don't take that on faith — prove Chromium launches on the bare
          # runner, and only pay for system deps on a run that needs them.
          if ! node -e "require('playwright').chromium.launch().then(b => b.close())"; then
            echo "chromium did not launch bare; installing system deps"
            npx playwright install-deps chromium
          fi

      - name: Wait for Pages to settle
        run: sleep 25

      - name: Capture screenshots (all views from scripts/views.json)
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p previews
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          # Manifest-driven loop. Home view lands at previews/<date>-<sha>.png
          # (unsuffixed, preserving wait-for-deploy.sh's contract); additional
          # views land at previews/<date>-<sha>-<view>.png. Add a view by
          # editing scripts/views.json — no workflow change needed.
          node scripts/screenshot.js --manifest scripts/views.json \
            "$PAGE_URL" previews "$DATE_TAG" "$SHA_SHORT"

      - name: Capture forced-state gallery (hours + seasons the schedule can't reach)
        # The nightly deploy lands ~00:10 UTC (sky.js bins that as night) in a
        # summer month, so the manifest step above only ever records night-summer.
        # This forces data-tod / data-season and captures the home view in each
        # gated state (messages/2026-07-17 "see your own work"). continue-on-error
        # is deliberate: a gallery failure must never block the home preview commit
        # below — that unsuffixed PNG is wait-for-deploy.sh's locked contract, and
        # the manifest step already wrote it before this step runs.
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          node scripts/screenshot.js --gallery \
            "$PAGE_URL" previews "$DATE_TAG" "$SHA_SHORT"

      - name: Capture motion filmstrips (the moving things a still can't prove)
        # Half the clearing moves — the smoke leaning downwind, the flag, the
        # swaying crowns, the night fireflies — and every still in the record
        # (manifest + gallery) swears none of it. This captures the home scene six
        # frames a beat apart and composites each into one read-left-to-right strip
        # (messages/2026-07-17 "see your own work", motion slice). continue-on-error
        # for the same reason as the gallery: a motion hiccup must never block the
        # unsuffixed home preview that wait-for-deploy.sh's locked contract needs —
        # the manifest step already wrote it before this step runs.
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          node scripts/screenshot.js --motion \
            "$PAGE_URL" previews "$DATE_TAG" "$SHA_SHORT"

      - name: Capture cross-view motion strip (one wind told twice)
        # The --motion strips above read across TIME within one view. This one
        # reads across the HOUSE: the front face (smoke leans downwind) stacked
        # over the door side (smoke rises straight, that face looking down the
        # wind's throat), so the whole quiet proof that ONE wind blows through the
        # clearing sits in a single frame — a thing no single-view strip can show
        # (diary 2026-07-19 … 2026-07-22). continue-on-error for the same reason as
        # the gallery and motion steps: a hiccup here must never block the unsuffixed
        # home preview that wait-for-deploy.sh's locked contract needs — the manifest
        # step already wrote it before this step runs.
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          node scripts/screenshot.js --motion-cross \
            "$PAGE_URL" previews "$DATE_TAG" "$SHA_SHORT"

      - name: Hold the clearing to the picture kept of it
        # Every other guard here is made of things the agent believes: a
        # reading held to a number she wrote, a bound she chose, a sweep minus
        # a list she compiled — and each was proved out by breaking the yard in
        # a way she had already imagined. So what they catch is bounded by that
        # imagination, and the far keeper's six green days are the case against
        # trusting it (diary 2026-09-03, 2026-09-04).
        #
        # This one knows nothing about the yard. It pins the clock and stops
        # the animations, which makes the frame a pure function of the drawing,
        # and holds it against the picture kept in previews/baseline/. Every
        # difference is either a thing the day meant — in which case the day
        # refreshes the baseline with `--accept` and commits it as the
        # declaration — or a thing nobody thought to ask about, which is the
        # only kind of finding no other check here can produce.
        #
        # continue-on-error, but NOT for the gallery/motion reason: a drifted
        # frame writes a `kept | this morning | what moved` picture into
        # previews/, and the commit step below is what puts it in the permanent
        # record where tomorrow's memory pass will find it. The run is failed
        # at the very end instead, by the gate step after the other two checks.
        id: drift
        continue-on-error: true
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          DATE_TAG="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          node tools/check-drift.js "$PAGE_URL" \
            --out previews --prefix "${DATE_TAG}-${SHA_SHORT}-"

      - name: Commit screenshots if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain previews/)" ]]; then
            DEPLOY_SHA="$(git rev-parse --short HEAD)"   # the commit whose deploy we screenshotted
            git add previews/
            git commit -m "ci: deploy preview for ${DEPLOY_SHA}" -m "[skip ci]"
            git push
          else
            echo "no screenshot changes to commit"
          fi

      - name: Hold the almanac to the clearing
        # /almanac/ publishes what this place will do on a day nobody has
        # reached yet. Its figures are asked of sky.js and season.js, so they
        # cannot drift — but its SENTENCES are a hand describing what each
        # season and hour changes in scene.css and inside.css, and a later day
        # could change a layer and never come back to mend the line. That made
        # the almanac the one thing here able to lie without anything breaking
        # (diary 2026-08-13). This reads the witnesses (window.CabinAlmanac)
        # off the page itself and goes and takes every measurement on the live
        # views, so it can only ever test the claims the page actually makes.
        #
        # Deliberately NOT continue-on-error, unlike the gallery and motion
        # steps: those are optional enrichments of the record, this is what
        # keeps a published promise honest, and it is supposed to turn the run
        # red. It sits LAST, after the previews are pushed, for the same reason
        # those steps carry the flag — a red check must never cost the record
        # its pictures.
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node tools/check-almanac.js "$PAGE_URL"

      - name: Hold the record to the clearing
        # The step above holds the almanac's SENTENCES to what the yard does.
        # This holds the gallery's PICTURES to what the yard shows, on one
        # claim: everything drawn in this clearing shows in at least one kept
        # frame. The forced states are two rails crossing at the middle, which
        # covers every layer gated on one wheel and misses any layer gated on
        # BOTH at once — those live only at a corner off both rails. There have
        # been such layers since Day 84 (the winter stars), and each has been
        # noticed by hand; this is so the next one needn't be. It sweeps all
        # sixteen (season, band) states on the three scene views and reads the
        # kept frames off GALLERY_STATES in scripts/screenshot.js, so it can
        # only ever test the gallery that actually runs.
        #
        # Same flags as the almanac check and for the same reasons: no
        # continue-on-error (a record that has stopped covering the clearing
        # should turn the run red) and last, after the previews are pushed, so
        # a red check never costs the record its pictures. Cheap — three page
        # loads, motion off, all sixteen states forced in the same DOM.
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node tools/check-gallery.js "$PAGE_URL"

      - name: Fail the run if the clearing drifted
        # The gate for the drift step above, which had to run before the commit
        # so its report pictures reached the record. Last of all, so the two
        # checks above still report before the run goes red — and so a red
        # check never costs the record its pictures, the same reason they sit
        # after the commit step themselves.
        if: steps.drift.outcome == 'failure'
        run: |
          echo "The clearing differs from the picture kept of it in" >&2
          echo "previews/baseline/. Read this run's previews/*-drift-*.png:" >&2
          echo "the three panels are kept | this morning | what moved." >&2
          echo "If every moved pixel was meant, run" >&2
          echo "  node tools/check-drift.js <url> --accept" >&2
          echo "and commit the refreshed baseline with the change it records." >&2
          exit 1
